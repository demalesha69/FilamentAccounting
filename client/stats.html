<!DOCTYPE html> 
<html lang="ru"> 
<head>
<meta charset="UTF-8">
    <title>Статистика - FilamentAccounting</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>

<div id="notification" class="notification" style="display:none;">
    <div class="notification-content">
        <i class="fa-solid fa-check-circle" id="notificationIcon"></i>
        <span id="notificationMessage">Успешно!</span>
    </div>
</div>

<div class="app">
    <div class="top-section">
        <div class="header">
            <h1 class="logo">Статистика</h1>
            <div id="authContainer"></div>
        </div>
        <div class="stats-controls">
            <div class="stats-period">
                <button class="period-btn active" onclick="setPeriod('all')" data-period="all">За все время</button>
                <button class="period-btn" onclick="setPeriod('day')" data-period="day">День</button>
                <button class="period-btn" onclick="setPeriod('week')" data-period="week">Неделя</button>
                <button class="period-btn" onclick="setPeriod('month')" data-period="month">Месяц</button>
                <button class="period-btn" onclick="setPeriod('year')" data-period="year">Год</button>
            </div>
            <div class="stats-custom">
                <input type="date" id="dateFrom" />
                <span>—</span>
                <input type="date" id="dateTo" />
                <button class="period-btn" onclick="setCustomPeriod()">Применить</button>
            </div>
        </div>
    </div>

    <main class="content">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">Всего катушек</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalMass">0</div>
                <div class="stat-label">Всего грамм</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgProgress">0%</div>
                <div class="stat-label">Средний остаток</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="usedMass">0</div>
                <div class="stat-label">Использовано грамм</div>
            </div>
        </div>
        <div class="stats-history" id="statsHistory"></div>
    </main>

    <footer class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-database"></i>
            <span>Катушки</span>
        </a>
        <a href="usage.html" class="nav-item">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Использование</span>
        </a>
        <a href="stats.html" class="nav-item active">
            <i class="fa-solid fa-chart-column"></i>
            <span>Статистика</span>
        </a>
        <button class="nav-item" onclick="openSettings()">
            <i class="fa-solid fa-gear"></i>
            <span>Настройки</span>
        </button>
    </footer>
</div>

<div class="modal-overlay" id="settingsModal">
    <div class="modal">
        <div class="modal-header">
            <h2>Настройки</h2>
            <button class="modal-close" onclick="closeSettings()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="setting-item">
                <label>Темная тема</label>
                <input type="checkbox" id="darkTheme" checked>
            </div>
            <div class="setting-item">
                <label>Уведомления</label>
                <input type="checkbox" id="notifications" checked>
            </div>
            <button class="save-button" onclick="saveSettings()">Сохранить</button>
        </div>
    </div>
</div>

<script>
const API_URL = 'http://186.246.28.163:8000';
let allConsumptions = [];
let currentPeriod = 'all';
let allFilaments = [];

function showNotification(message, type = 'success') {
    const notification = document.getElementById('notification');
    if (!notification) return;
    const messageEl = document.getElementById('notificationMessage');
    const iconEl = document.getElementById('notificationIcon');
    
    notification.className = 'notification';
    notification.classList.add(type);
    
    const icons = {
        success: 'fa-solid fa-check-circle',
        error: 'fa-solid fa-circle-exclamation',
        info: 'fa-solid fa-circle-info'
    };
    iconEl.className = icons[type] || icons.success;
    messageEl.textContent = message;
    notification.style.display = 'block';
    
    clearTimeout(notification._timeout);
    notification._timeout = setTimeout(() => {
        notification.style.display = 'none';
    }, 3000);
}

document.addEventListener('click', function(e) {
    const notification = document.getElementById('notification');
    if (notification && notification.contains(e.target)) {
        notification.style.display = 'none';
    }
});

// ============================
// ФОРМАТИРОВАНИЕ ВРЕМЕНИ (СЕКУНДЫ → ЛОКАЛЬНОЕ)
// ============================

function formatLocalDate(timestamp) {
    if (!timestamp) return '';
    try {
        let ts = timestamp;
        if (typeof ts === 'number' && ts < 10000000000) {
            ts = ts * 1000;
        }
        const date = new Date(ts);
        if (isNaN(date.getTime())) return String(timestamp);
        return date.toLocaleString();
    } catch (e) {
        return String(timestamp);
    }
}

function formatLocalDateShort(timestamp) {
    if (!timestamp) return '';
    try {
        let ts = timestamp;
        if (typeof ts === 'number' && ts < 10000000000) {
            ts = ts * 1000;
        }
        const date = new Date(ts);
        if (isNaN(date.getTime())) return String(timestamp);
        return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    } catch (e) {
        return String(timestamp);
    }
}

// ============================
// АВТОРИЗАЦИЯ
// ============================

async function checkAuth() {
    const token = localStorage.getItem('token');
    if (!token) {
        updateAuthUI(false);
        return false;
    }
    updateAuthUI(true);
    showUsername();
    return true;
}

function updateAuthUI(isLoggedIn) {
    const container = document.getElementById('authContainer');
    if (!container) return;
    if (isLoggedIn) {
        container.innerHTML = `
            <span style="color:#9ca3af; font-size:14px;" id="usernameDisplay"></span>
            <button class="icon-button" onclick="logout()" title="Выйти">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        `;
    } else {
        container.innerHTML = `
            <a href="login.html" class="icon-button" title="Войти">
                <i class="fa-solid fa-right-to-bracket"></i>
            </a>
        `;
    }
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'login.html';
}

function showUsername() {
    try {
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const display = document.getElementById('usernameDisplay');
        if (display) display.textContent = user.username || 'Пользователь';
    } catch (e) {}
}

function openSettings() {
    document.getElementById('settingsModal').style.display = 'flex';
}

function closeSettings() {
    document.getElementById('settingsModal').style.display = 'none';
}

document.getElementById('settingsModal').addEventListener('click', function(e) {
    if (e.target === this) closeSettings();
});

function saveSettings() {
    const theme = document.getElementById('darkTheme').checked;
    const notifications = document.getElementById('notifications').checked;
    console.log('Сохранено:', { theme, notifications });
    showNotification('Настройки сохранены!', 'success');
    closeSettings();
}

// ============================
// ЗАГРУЗКА ДАННЫХ
// ============================

async function loadStats() {
    const token = localStorage.getItem('token');
    if (!token) {
        showNotification('Вы не авторизованы', 'error');
        return;
    }
    try {
        const responseFilaments = await fetch(`${API_URL}/materials/`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            }
        });
        const filamentsData = await responseFilaments.json();
        if (!responseFilaments.ok) throw new Error(filamentsData.message || filamentsData.error || 'Ошибка загрузки катушек');
        allFilaments = filamentsData.data || [];
        
        const responseConsumptions = await fetch(`${API_URL}/consumptions/`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            }
        });
        const consumptionsData = await responseConsumptions.json();
        if (!responseConsumptions.ok) throw new Error(consumptionsData.message || consumptionsData.error || 'Ошибка загрузки расходов');
        allConsumptions = consumptionsData.data || [];
        
        updateStats(currentPeriod);
    } catch (error) {
        console.error('Ошибка загрузки статистики:', error);
        showNotification('Ошибка загрузки статистики', 'error');
    }
}

// ============================
// ФИЛЬТР ПО ПЕРИОДУ
// ============================

function getDateRange(period) {
    const now = new Date();
    const from = new Date();
    let to = new Date();
    
    switch(period) {
        case 'day':
            from.setHours(0, 0, 0, 0);
            break;
        case 'week':
            from.setDate(now.getDate() - 7);
            break;
        case 'month':
            from.setMonth(now.getMonth() - 1);
            break;
        case 'year':
            from.setFullYear(now.getFullYear() - 1);
            break;
        case 'all':
        default:
            from.setFullYear(2000);
            break;
    }
    return { from, to: now };
}

function filterConsumptionsByPeriod(period, customFrom = null, customTo = null) {
    let from, to;
    if (customFrom && customTo) {
        from = new Date(customFrom);
        to = new Date(customTo);
        to.setHours(23, 59, 59, 999);
    } else {
        const range = getDateRange(period);
        from = range.from;
        to = range.to;
    }
    
    return allConsumptions.filter(item => {
        const date = new Date(item.timestamp);
        return date >= from && date <= to;
    });
}

function setPeriod(period) {
    currentPeriod = period;
    document.querySelectorAll('.period-btn').forEach(btn => btn.classList.remove('active'));
    const btn = document.querySelector(`.period-btn[data-period="${period}"]`);
    if (btn) btn.classList.add('active');
    updateStats(period);
}

function setCustomPeriod() {
    const from = document.getElementById('dateFrom').value;
    const to = document.getElementById('dateTo').value;
    if (!from || !to) {
        showNotification('Выберите обе даты', 'error');
        return;
    }
    document.querySelectorAll('.period-btn').forEach(btn => btn.classList.remove('active'));
    currentPeriod = 'custom';
    updateStats('custom', from, to);
}

function updateStats(period, customFrom = null, customTo = null) {
    const filtered = filterConsumptionsByPeriod(period, customFrom, customTo);
    
    const totalCount = allFilaments.length;
    const totalInitialMass = allFilaments.reduce((sum, f) => sum + (f.initial_mass || 0), 0);
    const totalCurrentMass = allFilaments.reduce((sum, f) => sum + (f.current_mass || 0), 0);
    const totalUsedMass = totalInitialMass - totalCurrentMass;
    const avgProgress = totalCount > 0 ? Math.round(totalCurrentMass / totalInitialMass * 100) : 0;
    
    document.getElementById('totalCount').textContent = totalCount;
    document.getElementById('totalMass').textContent = totalInitialMass;
    document.getElementById('avgProgress').textContent = avgProgress + '%';
    document.getElementById('usedMass').textContent = totalUsedMass;
    
    renderStatsHistory(filtered);
}

function renderStatsHistory(consumptions) {
    const container = document.getElementById('statsHistory');
    if (!consumptions || consumptions.length === 0) {
        container.innerHTML = `
            <div style="text-align:center;padding:40px;color:#9ca3af;">
                <i class="fa-solid fa-inbox" style="font-size:48px;display:block;margin-bottom:12px;opacity:0.5;"></i>
                <p>За выбранный период расходов не было</p>
            </div>
        `;
        return;
    }
    
    const grouped = {};
    consumptions.forEach(item => {
        const date = new Date(item.timestamp);
        const key = date.toLocaleDateString();
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(item);
    });
    
    let html = '';
    for (const [date, items] of Object.entries(grouped)) {
        const totalUsed = items.reduce((sum, i) => sum + i.used_mass, 0);
        html += `
            <div class="stats-day">
                <div class="stats-day-header">
                    <span class="stats-day-date">${date}</span>
                    <span class="stats-day-total">Всего: -${totalUsed}g</span>
                </div>
                <div class="stats-day-items">
        `;
        items.forEach(item => {
            const localTime = item.timestamp ? formatLocalDateShort(item.timestamp) : '';
            html += `
                <div class="stats-day-item">
                    <span class="stats-day-item-title">${item.title || 'Без названия'}</span>
                    <span class="stats-day-item-time">${localTime}</span>
                    <span class="stats-day-item-amount">-${item.used_mass}g</span>
                </div>
            `;
        });
        html += `
                </div>
            </div>
        `;
    }
    
    container.innerHTML = html;
}

window.onload = async function() {
    await checkAuth();
    await loadStats();
};
</script>
</body>
</html>
