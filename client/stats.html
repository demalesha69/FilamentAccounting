<!DOCTYPE html> 
<html lang="ru"> 
<head>
<meta charset="UTF-8">
    <title>Статистика - FilamentAccounting</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
	 <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧵%3C/text%3E%3C/svg%3E" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
</head>
<body>

<div id="notification" class="notification" style="display:none;">
    <div class="notification-content">
        <i class="fa-solid fa-check-circle" id="notificationIcon"></i>
        <span id="notificationMessage">Успешно!</span>
    </div>
</div>

<div class="app">
    <div class="top-section">
        <div class="top-section-inner">
            <div class="header">
                <h1 class="logo">Статистика</h1>
                <div id="authContainer"></div>
            </div>
            <div class="stats-controls">
                <div class="stats-period">
                    <button class="period-btn active" onclick="setPeriod('all')" data-period="all">За все время</button>
                    <button class="period-btn" onclick="setPeriod('day')" data-period="day">День</button>
                    <button class="period-btn" onclick="setPeriod('week')" data-period="week">Неделя</button>
                    <button class="period-btn" onclick="setPeriod('month')" data-period="month">Месяц</button>
                    <button class="period-btn" onclick="setPeriod('year')" data-period="year">Год</button>
                </div>
                <div class="stats-custom">
                    <input type="date" id="dateFrom" />
                    <span>—</span>
                    <input type="date" id="dateTo" />
                    <button class="period-btn" onclick="setCustomPeriod()">Применить</button>
                </div>
            </div>
        </div>
    </div>

    <main class="content">
        <!-- Основные показатели -->
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:12px;">
            <div class="stat-card" style="background:rgba(74,222,128,0.1); border-color:rgba(74,222,128,0.2);">
                <div class="stat-value" id="totalUsed" style="color:#4ade80;">0</div>
                <div class="stat-label">Общий расход</div>
            </div>
            <div class="stat-card" style="background:rgba(59,130,246,0.1); border-color:rgba(59,130,246,0.2);">
                <div class="stat-value" id="successUsed" style="color:#60a5fa;">0</div>
                <div class="stat-label">Успешная печать</div>
            </div>
            <div class="stat-card" style="background:rgba(239,68,68,0.1); border-color:rgba(239,68,68,0.2);">
                <div class="stat-value" id="wasteUsed" style="color:#f87171;">0</div>
                <div class="stat-label">Брак и прервано</div>
            </div>
        </div>
        
        <!-- Эффективность и средние -->
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:12px;">
            <div class="stat-card" style="background:rgba(139,92,246,0.1); border-color:rgba(139,92,246,0.2);">
                <div class="stat-value" id="efficiency" style="color:#8b5cf6;">0%</div>
                <div class="stat-label">Эффективность</div>
            </div>
            <div class="stat-card" style="background:rgba(245,158,11,0.1); border-color:rgba(245,158,11,0.2);">
                <div class="stat-value" id="avgPerPrint" style="color:#fbbf24;">0</div>
                <div class="stat-label">Среднее за печать</div>
            </div>
            <div class="stat-card" style="background:rgba(34,211,238,0.1); border-color:rgba(34,211,238,0.2);">
                <div class="stat-value" id="avgPerDay" style="color:#22d3ee;">0</div>
                <div class="stat-label">Среднее в день <span id="periodLabel" style="font-size:10px;color:#9ca3af;display:block;">за все время</span></div>
            </div>
        </div>
        
        <!-- Количество катушек и операций -->
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div class="stat-card">
                <div class="stat-value" id="totalMaterials" style="color:#8b5cf6;">0</div>
                <div class="stat-label">Всего катушек</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalOperations" style="color:#8b5cf6;">0</div>
                <div class="stat-label">Операций расхода</div>
            </div>
        </div>
    </main>

    <footer class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-database"></i>
            <span>Катушки</span>
        </a>
        <a href="usage.html" class="nav-item">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Использование</span>
        </a>
        <a href="stats.html" class="nav-item active">
            <i class="fa-solid fa-chart-column"></i>
            <span>Статистика</span>
        </a>
    </footer>
</div>

<script src="js/stats.js"></script>
</body>
</html>
