<!DOCTYPE html> 
<html lang="ru"> 
<head>
<meta charset="UTF-8">
    <title>Статистика - FilamentAccounting</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>

<script>
const API_URL = 'http://186.246.28.163:8000';

// ============================
// АВТОРИЗАЦИЯ
// ============================

async function checkAuth() {
    const token = localStorage.getItem('token');
    console.log('checkAuth: токен =', token);
    
    if (!token) {
        updateAuthUI(false);
        return false;
    }
    updateAuthUI(true);
    return true;
}

function updateAuthUI(isLoggedIn) {
    const container = document.getElementById('authContainer');
    console.log('updateAuthUI: isLoggedIn =', isLoggedIn, 'container =', container);
    
    if (!container) return;
    
    if (isLoggedIn) {
        container.innerHTML = `
            <span style="color:#9ca3af; font-size:14px;" id="usernameDisplay"></span>
            <button class="icon-button" onclick="logout()" title="Выйти">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        `;
        console.log('Контейнер обновлён, вызываем showUsername()');
        showUsername();
    } else {
        container.innerHTML = `
            <a href="login.html" class="icon-button" title="Войти">
                <i class="fa-solid fa-right-to-bracket"></i>
            </a>
        `;
    }
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'login.html';
}

function showUsername() {
    try {
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const display = document.getElementById('usernameDisplay');
        console.log('showUsername: user =', user, 'display =', display);
        
        if (display) {
            display.textContent = user.username || 'Пользователь';
            console.log('Имя установлено:', display.textContent);
        } else {
            console.log('Элемент usernameDisplay НЕ НАЙДЕН');
        }
    } catch (e) {
        console.log('Ошибка showUsername:', e);
    }
}

// ============================
// ЗАГРУЗКА СТАТИСТИКИ
// ============================

async function loadStats() {
    const token = localStorage.getItem('token');
    if (!token) return;
    try {
        const response = await fetch(`${API_URL}/materials/`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            }
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || data.error || 'Ошибка загрузки');
        const filaments = data.data || [];
        updateStats(filaments);
    } catch (error) {
        console.error('Ошибка загрузки статистики:', error);
    }
}

function updateStats(filaments) {
    const totalCount = filaments.length;
    const totalInitialMass = filaments.reduce((sum, f) => sum + (f.initial_mass || 0), 0);
    const totalCurrentMass = filaments.reduce((sum, f) => sum + (f.current_mass || 0), 0);
    const totalUsedMass = totalInitialMass - totalCurrentMass;
    const avgProgress = totalCount > 0 ? Math.round(totalCurrentMass / totalInitialMass * 100) : 0;
    
    document.getElementById('totalCount').textContent = totalCount;
    document.getElementById('totalMass').textContent = totalInitialMass;
    document.getElementById('avgProgress').textContent = avgProgress + '%';
    document.getElementById('usedMass').textContent = totalUsedMass;
}

// ============================
// НАСТРОЙКИ
// ============================

function openSettings() {
    document.getElementById('settingsModal').style.display = 'flex';
}

function closeSettings() {
    document.getElementById('settingsModal').style.display = 'none';
}

document.getElementById('settingsModal').addEventListener('click', function(e) {
    if (e.target === this) closeSettings();
});

function saveSettings() {
    const theme = document.getElementById('darkTheme').checked;
    const units = document.getElementById('unitsSelect').value;
    const notifications = document.getElementById('notifications').checked;
    console.log('Сохранено:', { theme, units, notifications });
    alert('Настройки сохранены!');
    closeSettings();
}

// ============================
// ИНИЦИАЛИЗАЦИЯ
// ============================

window.onload = async function() {
    console.log('window.onload stats.html');
    await checkAuth();
    await loadStats();
};
</script>

<div class="app">
    <div class="top-section">
        <div class="header">
            <h1 class="logo">Статистика</h1>
            <div id="authContainer"></div>
        </div>
    </div>

    <main class="content">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">Всего катушек</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalMass">0</div>
                <div class="stat-label">Всего грамм</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgProgress">0%</div>
                <div class="stat-label">Средний остаток</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="usedMass">0</div>
                <div class="stat-label">Использовано грамм</div>
            </div>
        </div>
    </main>

    <footer class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-database"></i>
            <span>Катушки</span>
        </a>
        <a href="usage.html" class="nav-item">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Использование</span>
        </a>
        <a href="stats.html" class="nav-item active">
            <i class="fa-solid fa-chart-column"></i>
            <span>Статистика</span>
        </a>
        <button class="nav-item" onclick="openSettings()">
            <i class="fa-solid fa-gear"></i>
            <span>Настройки</span>
        </button>
    </footer>
</div>

<!-- МОДАЛКА НАСТРОЕК -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal">
        <div class="modal-header">
            <h2>Настройки</h2>
            <button class="modal-close" onclick="closeSettings()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="setting-item">
                <label>Темная тема</label>
                <input type="checkbox" id="darkTheme" checked>
            </div>
            <div class="setting-item">
                <label>Единицы измерения</label>
                <select id="unitsSelect">
                    <option value="grams">Граммы</option>
                    <option value="kg">Килограммы</option>
                </select>
            </div>
            <div class="setting-item">
                <label>Уведомления</label>
                <input type="checkbox" id="notifications" checked>
            </div>
            <button class="save-button" onclick="saveSettings()">Сохранить</button>
        </div>
    </div>
</div>
</body>
</html>
