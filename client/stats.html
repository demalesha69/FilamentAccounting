<!DOCTYPE html> 
<html lang="ru"> 
<head>
<meta charset="UTF-8">
    <title>Статистика - FilamentAccounting</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>

<!-- УВЕДОМЛЕНИЕ -->
<div id="notification" class="notification" style="display:none;">
    <div class="notification-content">
        <i class="fa-solid fa-check-circle" id="notificationIcon"></i>
        <span id="notificationMessage">Успешно!</span>
    </div>
</div>

<div class="app">
    <div class="top-section">
        <div class="header">
            <h1 class="logo">Статистика</h1>
            <div id="authContainer"></div>
        </div>
        <div class="stats-controls">
            <div class="stats-period">
                <button class="period-btn active" onclick="setPeriod('all')" data-period="all">За все время</button>
                <button class="period-btn" onclick="setPeriod('day')" data-period="day">День</button>
                <button class="period-btn" onclick="setPeriod('week')" data-period="week">Неделя</button>
                <button class="period-btn" onclick="setPeriod('month')" data-period="month">Месяц</button>
                <button class="period-btn" onclick="setPeriod('year')" data-period="year">Год</button>
            </div>
            <div class="stats-custom">
                <input type="date" id="dateFrom" />
                <span>—</span>
                <input type="date" id="dateTo" />
                <button class="period-btn" onclick="setCustomPeriod()">Применить</button>
            </div>
        </div>
    </div>

    <main class="content">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalUsed">0</div>
                <div class="stat-label">Использовано (грамм)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalMaterials">0</div>
                <div class="stat-label">Всего катушек</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalOperations">0</div>
                <div class="stat-label">Операций расхода</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgPerDay">0</div>
                <div class="stat-label">Среднее в день (г)</div>
            </div>
        </div>
        <div class="stats-history" id="statsHistory"></div>
    </main>

    <footer class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-database"></i>
            <span>Катушки</span>
        </a>
        <a href="usage.html" class="nav-item">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Использование</span>
        </a>
        <a href="stats.html" class="nav-item active">
            <i class="fa-solid fa-chart-column"></i>
            <span>Статистика</span>
        </a>
        <button class="nav-item" onclick="openSettings()">
            <i class="fa-solid fa-gear"></i>
            <span>Настройки</span>
        </button>
    </footer>
</div>

<!-- МОДАЛКА НАСТРОЕК -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal">
        <div class="modal-header">
            <h2>Настройки</h2>
            <button class="modal-close" onclick="closeSettings()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="setting-item">
                <label>Темная тема</label>
                <input type="checkbox" id="darkTheme" checked>
            </div>
            <div class="setting-item">
                <label>Уведомления</label>
                <input type="checkbox" id="notifications" checked>
            </div>
            <button class="save-button" onclick="saveSettings()">Сохранить</button>
        </div>
    </div>
</div>

<script>
const API_URL = 'http://186.246.28.163:8000';
let currentPeriod = 'all';
let currentStartTimestamp = null;
let currentEndTimestamp = null;

// ============================
// УВЕДОМЛЕНИЯ
// ============================

function showNotification(message, type = 'success') {
    const notification = document.getElementById('notification');
    if (!notification) return;
    const messageEl = document.getElementById('notificationMessage');
    const iconEl = document.getElementById('notificationIcon');
    
    notification.className = 'notification';
    notification.classList.add(type);
    
    const icons = {
        success: 'fa-solid fa-check-circle',
        error: 'fa-solid fa-circle-exclamation',
        info: 'fa-solid fa-circle-info'
    };
    iconEl.className = icons[type] || icons.success;
    messageEl.textContent = message;
    notification.style.display = 'block';
    
    clearTimeout(notification._timeout);
    notification._timeout = setTimeout(() => {
        notification.style.display = 'none';
    }, 3000);
}

document.addEventListener('click', function(e) {
    const notification = document.getElementById('notification');
    if (notification && notification.contains(e.target)) {
        notification.style.display = 'none';
    }
});

// ============================
// ФОРМАТИРОВАНИЕ ВРЕМЕНИ
// ============================

function formatLocalDateShort(timestamp) {
    if (!timestamp) return '';
    try {
        const date = new Date(timestamp * 1000);
        if (isNaN(date.getTime())) return String(timestamp);
        return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    } catch (e) {
        return String(timestamp);
    }
}

function getDateRange(period) {
    const now = Math.floor(Date.now() / 1000);
    let start = 0;
    
    switch(period) {
        case 'day':
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            start = Math.floor(today.getTime() / 1000);
            break;
        case 'week':
            start = now - 7 * 24 * 60 * 60;
            break;
        case 'month':
            start = now - 30 * 24 * 60 * 60;
            break;
        case 'year':
            start = now - 365 * 24 * 60 * 60;
            break;
        case 'all':
        default:
            start = 0;
            break;
    }
    return { start, end: now };
}

// ============================
// АВТОРИЗАЦИЯ
// ============================

async function checkAuth() {
    const token = localStorage.getItem('token');
    if (!token) {
        updateAuthUI(false);
        return false;
    }
    updateAuthUI(true);
    showUsername();
    return true;
}

function updateAuthUI(isLoggedIn) {
    const container = document.getElementById('authContainer');
    if (!container) return;
    if (isLoggedIn) {
        container.innerHTML = `
            <span style="color:#9ca3af; font-size:14px;" id="usernameDisplay"></span>
            <button class="icon-button" onclick="logout()" title="Выйти">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        `;
    } else {
        container.innerHTML = `
            <a href="login.html" class="icon-button" title="Войти">
                <i class="fa-solid fa-right-to-bracket"></i>
            </a>
        `;
    }
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'login.html';
}

function showUsername() {
    try {
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const display = document.getElementById('usernameDisplay');
        if (display) display.textContent = user.username || 'Пользователь';
    } catch (e) {}
}

// ============================
// НАСТРОЙКИ
// ============================

function openSettings() {
    document.getElementById('settingsModal').style.display = 'flex';
}

function closeSettings() {
    document.getElementById('settingsModal').style.display = 'none';
}

document.getElementById('settingsModal').addEventListener('click', function(e) {
    if (e.target === this) closeSettings();
});

function saveSettings() {
    const theme = document.getElementById('darkTheme').checked;
    const notifications = document.getElementById('notifications').checked;
    console.log('Сохранено:', { theme, notifications });
    showNotification('Настройки сохранены!', 'success');
    closeSettings();
}

// ============================
// ЗАГРУЗКА СТАТИСТИКИ (GET /statistics)
// ============================

async function loadStats(startTimestamp = null, endTimestamp = null) {
    const token = localStorage.getItem('token');
    if (!token) {
        showNotification('Вы не авторизованы', 'error');
        return;
    }
    
    try {
        let url = `${API_URL}/statistics`;
        const params = [];
        
        if (startTimestamp !== null) {
            params.push(`start_timestamp=${startTimestamp}`);
        }
        if (endTimestamp !== null) {
            params.push(`end_timestamp=${endTimestamp}`);
        }
        if (params.length > 0) {
            url += '?' + params.join('&');
        }
        
        console.log('Запрос статистики:', url);
        
        const response = await fetch(url, {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        
        const data = await response.json();
        console.log('Полный ответ статистики:', data);
        
        // === ИСПРАВЛЕНИЕ: Проверяем статус из data ===
        if (data.status != 200) {
            throw new Error(data.message || 'Ошибка загрузки статистики');
        }
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        // === ИСПРАВЛЕНИЕ: Правильно извлекаем данные ===
        let statsData = data.data;
    
        
        console.log('Данные для обновления:', statsData);
        updateStats(statsData);
        
    } catch (error) {
        console.error('Ошибка загрузки статистики:', error);
        showNotification('Ошибка загрузки статистики: ' + error.message, 'error');
    }
}

function updateStats(data) {
    console.log('updateStats получил:', data);
    
    // Безопасное извлечение значений
    const totalUsed = data.total_used_mass;
    const materialsCount = data.materials_count;
    const consumptionsCount = data.consumptions_count;
    
    console.log('Парсинг:', { totalUsed, materialsCount, consumptionsCount });
    
    // Среднее в день (за период)
    let avgPerDay = 0;
    if (currentPeriod !== 'all' && currentPeriod !== 'custom') {
        const range = getDateRange(currentPeriod);
        const days = Math.max(1, Math.ceil((range.end - range.start) / (24 * 60 * 60)));
        avgPerDay = totalUsed / days;
    } else if (currentPeriod === 'all' && totalUsed > 0 && data.first_consumption_timestamp) {
        // Для "за все время" считаем среднее по дням с момента первого расхода
        const firstTs = data.first_consumption_timestamp;
        const now = Math.floor(Date.now() / 1000);
        const days = Math.max(1, Math.ceil((now - firstTs) / (24 * 60 * 60)));
        avgPerDay = totalUsed / days;
    }
    
    document.getElementById('totalUsed').textContent = totalUsed.toFixed(1);
    document.getElementById('totalMaterials').textContent = materialsCount;
    document.getElementById('totalOperations').textContent = consumptionsCount;
    document.getElementById('avgPerDay').textContent = avgPerDay > 0 ? avgPerDay.toFixed(1) : '—';
}

// ============================
// ПЕРИОДЫ
// ============================

function setPeriod(period) {
    currentPeriod = period;
    document.querySelectorAll('.period-btn').forEach(btn => btn.classList.remove('active'));
    const btn = document.querySelector(`.period-btn[data-period="${period}"]`);
    if (btn) btn.classList.add('active');
    
    const range = getDateRange(period);
    currentStartTimestamp = range.start;
    currentEndTimestamp = range.end;
    
    console.log('Период:', period, 'с:', currentStartTimestamp, 'по:', currentEndTimestamp);
    loadStats(currentStartTimestamp, currentEndTimestamp);
}

function setCustomPeriod() {
    const from = document.getElementById('dateFrom').value;
    const to = document.getElementById('dateTo').value;
    if (!from || !to) {
        showNotification('Выберите обе даты', 'error');
        return;
    }
    
    document.querySelectorAll('.period-btn').forEach(btn => btn.classList.remove('active'));
    currentPeriod = 'custom';
    
    const startDate = new Date(from);
    startDate.setHours(0, 0, 0, 0);
    const endDate = new Date(to);
    endDate.setHours(23, 59, 59, 999);
    
    currentStartTimestamp = Math.floor(startDate.getTime() / 1000);
    currentEndTimestamp = Math.floor(endDate.getTime() / 1000);
    
    loadStats(currentStartTimestamp, currentEndTimestamp);
}

// ============================
// ИНИЦИАЛИЗАЦИЯ
// ============================

window.onload = async function() {
    await checkAuth();
    setPeriod('all');
};
</script>
</body>
</html>
