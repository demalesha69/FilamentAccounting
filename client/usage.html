<!DOCTYPE html> 
<html lang="ru"> 
<head>
<meta charset="UTF-8">
    <title>Использование - FilamentAccounting</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>

<div id="notification" class="notification" style="display:none;">
    <div class="notification-content">
        <i class="fa-solid fa-check-circle" id="notificationIcon"></i>
        <span id="notificationMessage">Успешно!</span>
    </div>
</div>

<div class="app">
    <div class="top-section">
        <div class="header">
            <h1 class="logo">Использование</h1>
            <div id="authContainer"></div>
        </div>
        <div class="search-section">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Поиск..." oninput="filterHistory()" />
            </div>
            <button class="filter-button" onclick="toggleSort()" title="Сортировка">
                <i class="fa-solid fa-arrow-up-wide-short"></i>
            </button>
        </div>
    </div>

    <main class="content">
        <div class="history-list" id="historyList"></div>
    </main>

    <button class="fab-button" onclick="openAddConsumption()">
        <i class="fa-solid fa-plus"></i>
    </button>

    <footer class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-database"></i>
            <span>Катушки</span>
        </a>
        <a href="usage.html" class="nav-item active">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Использование</span>
        </a>
        <a href="stats.html" class="nav-item">
            <i class="fa-solid fa-chart-column"></i>
            <span>Статистика</span>
        </a>
        <button class="nav-item" onclick="openSettings()">
            <i class="fa-solid fa-gear"></i>
            <span>Настройки</span>
        </button>
    </footer>
</div>

<div class="modal-overlay" id="settingsModal">
    <div class="modal">
        <div class="modal-header">
            <h2>Настройки</h2>
            <button class="modal-close" onclick="closeSettings()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="setting-item">
                <label>Темная тема</label>
                <input type="checkbox" id="darkTheme" checked>
            </div>
            <div class="setting-item">
                <label>Уведомления</label>
                <input type="checkbox" id="notifications" checked>
            </div>
            <button class="save-button" onclick="saveSettings()">Сохранить</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="addConsumptionModal">
    <div class="modal modal-wide">
        <div class="modal-header">
            <h2>Добавить расход</h2>
            <button class="modal-close" onclick="closeAddConsumption()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="consumptionMaterialSelect"><i class="fa-solid fa-box"></i> Катушка</label>
                <select id="consumptionMaterialSelect">
                    <option value="">Загрузка...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="consumptionTitle"><i class="fa-solid fa-pen"></i> Название действия</label>
                <input type="text" id="consumptionTitle" placeholder="Печать детали" />
            </div>
            <div class="form-group">
                <label for="consumptionMass"><i class="fa-solid fa-weight-scale"></i> Использовано (граммы)</label>
                <input type="number" id="consumptionMass" placeholder="50" value="10" />
            </div>
            <button class="auth-button" id="addConsumptionBtn" onclick="createConsumption()" disabled>
                <i class="fa-solid fa-floppy-disk"></i> Сохранить расход
            </button>
        </div>
    </div>
</div>

<script src="js/usage.js"></script>
</body>
</html>
