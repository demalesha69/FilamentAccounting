<!DOCTYPE html> 
<html lang="ru"> 
<head>
<meta charset="UTF-8">
    <title>Использование - FilamentAccounting</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
	 <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧵%3C/text%3E%3C/svg%3E" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
</head>
<body>

<div id="notification" class="notification" style="display:none;">
    <div class="notification-content">
        <i class="fa-solid fa-check-circle" id="notificationIcon"></i>
        <span id="notificationMessage">Успешно!</span>
    </div>
</div>

<div class="app">
    <div class="top-section">
        <div class="top-section-inner">
            <div class="header">
                <h1 class="logo">Использование</h1>
                <div id="authContainer"></div>
            </div>
            <div class="search-section">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Поиск..." oninput="searchConsumptions()" />
                </div>
                <button class="filter-button" onclick="toggleSort()" title="Сортировка">
                    <i class="fa-solid fa-arrow-up-wide-short"></i>
                </button>
            </div>
        </div>
    </div>

    <main class="content content-padded">
        <div style="margin-bottom:12px;">
            <button class="filter-option" onclick="toggleStatusFilterContainer()" id="filterStatusToggle" style="padding:10px 14px; font-size:14px;">
                <i class="fa-solid fa-circle-check"></i> 
                <span id="filterStatusLabel">Все статусы</span>
                <span id="filterStatusCount" style="color:#8b5cf6; font-size:12px; margin-left:auto; display:none;"></span>
                <i class="fa-solid fa-chevron-down" style="margin-left:6px;"></i>
            </button>
            <div id="statusFilterContainer" style="display:none; flex-direction:column; gap:4px; padding:8px 0 0 12px; max-height:150px; overflow-y:auto;">
            </div>
        </div>
        
        <div class="history-list" id="historyList"></div>
    </main>

    <div class="fab-single">
        <button class="fab-button" onclick="openAddConsumption()">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <footer class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-database"></i>
            <span>Катушки</span>
        </a>
        <a href="usage.html" class="nav-item active">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Использование</span>
        </a>
        <a href="stats.html" class="nav-item">
            <i class="fa-solid fa-chart-column"></i>
            <span>Статистика</span>
        </a>
    </footer>
</div>

<!-- Модальное окно добавления расхода -->
<div class="modal-overlay" id="addConsumptionModal">
    <div class="modal modal-wide">
        <div class="modal-header">
            <h2>Добавить расход</h2>
            <button class="modal-close" onclick="closeAddConsumption()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="consumptionMaterialSelect"><i class="fa-solid fa-box"></i> Катушка</label>
                <select id="consumptionMaterialSelect" class="styled-select">
                    <option value="">Загрузка...</option>
                </select>
            </div>
            
            <!-- Кнопка переключения режима -->
            <button class="auth-button" id="fileUploadBtn" onclick="toggleFileUpload()" type="button" style="background:#232734; color:#9ca3af; font-size:14px; padding:10px; margin-top:0;">
                Загрузить файл слайсера
            </button>
            
            <!-- Область загрузки файла -->
            <div id="fileUploadArea" style="display:none; flex-direction:column; gap:12px; margin-top:8px;">
                <div style="border:2px dashed rgba(255,255,255,0.1); border-radius:16px; padding:20px; text-align:center; background:#1a1d26; cursor:pointer;" 
                     onclick="document.getElementById('fileInput').click()">
                    <i class="fa-solid fa-cloud-arrow-up" style="font-size:32px; color:#6b7280; display:block; margin-bottom:8px;"></i>
                    <p style="color:#9ca3af; font-size:14px;">Нажмите или перетащите файл слайсера</p>
                    <p style="color:#6b7280; font-size:12px; margin-top:4px;">Поддерживаются: .gcode, .bgcode, .3mf</p>
                </div>
                <input type="file" id="fileInput" accept=".gcode,.bgcode,.3mf" style="display:none;" onchange="handleFileSelect(event)" />
                
                <!-- Информация о загруженном файле -->
                <div id="fileInfo" style="display:none; background:#232734; border-radius:10px; padding:10px 14px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <span style="color:#ffffff; font-weight:500;" id="fileName">file.gcode</span>
                            <span style="color:#6b7280; font-size:12px; margin-left:8px;" id="fileSize">0 КБ</span>
                        </div>
                        <button onclick="document.getElementById('fileInput').value=''; document.getElementById('fileInfo').style.display='none'; document.getElementById('fileParsedInfo').style.display='none'; document.getElementById('toolSelector').style.display='none'; parsedFileData=null; document.getElementById('addConsumptionBtn').disabled=true; document.getElementById('addConsumptionBtn').style.opacity='0.5';" style="background:transparent; border:none; color:#9ca3af; cursor:pointer; font-size:18px;">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Результат парсинга -->
                <div id="fileParsedInfo" style="display:none;"></div>
                
                <!-- Селектор инструментов для многокатушечных файлов -->
                <div id="toolSelector" style="display:none;"></div>
            </div>
            
            <!-- Область ручного ввода -->
            <div id="manualInputArea" style="display:block;">
                <div class="form-group" style="margin-top:8px;">
                    <label for="consumptionTitle"><i class="fa-solid fa-pen"></i> Название действия</label>
                    <input type="text" id="consumptionTitle" placeholder="Печать детали" />
                </div>
                <div class="form-group">
                    <label for="consumptionLength"><i class="fa-solid fa-ruler"></i> Использовано (миллиметры)</label>
                    <input type="number" id="consumptionLength" placeholder="1000" value="1000" step="1" />
                </div>
                
                <!-- ВЫБОР СТАТУСА ПЕЧАТИ -->
                <div class="form-group">
                    <label for="printStatus"><i class="fa-solid fa-circle-check"></i> Статус печати</label>
                    <select id="printStatus" class="styled-select">
                        <option value="success">Успешная печать</option>
                        <option value="waste">Брак</option>
                        <option value="interrupted">Прерванная печать</option>
                    </select>
                </div>
            </div>
            
            <button class="auth-button" id="addConsumptionBtn" disabled>
                <i class="fa-solid fa-floppy-disk"></i> Сохранить расход
            </button>
        </div>
    </div>
</div>

<script src="js/usage.js"></script>
</body>
</html>
