<!DOCTYPE html> 
<html lang="ru"> 
<head>
<meta charset="UTF-8">
    <title>Использование - FilamentAccounting</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>

<script>
const API_URL = 'http://186.246.28.163:8000';

// ============================
// АВТОРИЗАЦИЯ
// ============================

async function checkAuth() {
    const token = localStorage.getItem('token');
    if (!token) {
        updateAuthUI(false);
        return false;
    }
    updateAuthUI(true);
    showUsername();
    return true;
}

function updateAuthUI(isLoggedIn) {
    const container = document.getElementById('authContainer');
    if (!container) return;
    if (isLoggedIn) {
        container.innerHTML = `
            <span style="color:#9ca3af; font-size:14px;" id="usernameDisplay"></span>
            <button class="icon-button" onclick="logout()" title="Выйти">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        `;
        showUsername();
    } else {
        container.innerHTML = `
            <a href="login.html" class="icon-button" title="Войти">
                <i class="fa-solid fa-right-to-bracket"></i>
            </a>
        `;
    }
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'login.html';
}

function showUsername() {
    try {
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const display = document.getElementById('usernameDisplay');
        if (display) {
            display.textContent = user.username || 'Пользователь';
        }
    } catch (e) {
        console.log('Ошибка отображения имени пользователя:', e);
    }
}

// ============================
// ЗАГРУЗКА ВСЕХ РАСХОДОВ
// ============================

let allConsumptions = [];
let currentConsumptionSort = 'default';

async function loadAllConsumptions() {
    const token = localStorage.getItem('token');
    if (!token) return;
    try {
        const response = await fetch(`${API_URL}/consumptions/`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            }
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || data.error || 'Ошибка загрузки');
        allConsumptions = data.data || [];
        renderConsumptions(allConsumptions);
    } catch (error) {
        console.error('Ошибка загрузки расходов:', error);
        document.getElementById('historyList').innerHTML = `
            <div style="text-align:center;padding:40px;color:#ff5f5f;">
                <i class="fa-solid fa-circle-exclamation" style="font-size:48px;display:block;margin-bottom:12px;"></i>
                Ошибка загрузки истории
            </div>
        `;
    }
}

function renderConsumptions(consumptions) {
    const list = document.getElementById('historyList');
    if (!consumptions || consumptions.length === 0) {
        list.innerHTML = `
            <div style="text-align:center;padding:40px;color:#9ca3af;">
                <i class="fa-solid fa-inbox" style="font-size:48px;display:block;margin-bottom:12px;opacity:0.5;"></i>
                <p>История расходов пуста</p>
            </div>
        `;
        return;
    }
    list.innerHTML = consumptions.map(item => `
        <div class="history-item" data-title="${(item.title || '').toLowerCase()}" data-material="${item.material_id || ''}">
            <div class="history-icon" style="color:#8b5cf6;">
                <i class="fa-solid fa-print"></i>
            </div>
            <div class="history-details">
                <div class="history-title">${item.title || 'Без названия'}</div>
                <div class="history-meta">
                    ${item.timestamp ? new Date(item.timestamp).toLocaleString('ru-RU') : ''} 
                    • Материал ID: ${item.material_id} 
                    • Остаток: ${item.remain_mass}g
                </div>
            </div>
            <div class="history-amount-remove">-${item.used_mass}g</div>
        </div>
    `).join('');
}

function filterHistory() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    document.querySelectorAll('.history-item').forEach(item => {
        const title = item.dataset.title || '';
        const material = item.dataset.material || '';
        item.style.display = (title.includes(query) || material.includes(query)) ? 'flex' : 'none';
    });
}

function toggleSort() {
    const types = ['default', 'dateDesc', 'dateAsc', 'title', 'amount'];
    const currentIndex = types.indexOf(currentConsumptionSort);
    const nextIndex = (currentIndex + 1) % types.length;
    currentConsumptionSort = types[nextIndex];
    
    let sorted = [...allConsumptions];
    switch(currentConsumptionSort) {
        case 'dateDesc':
            sorted.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            break;
        case 'dateAsc':
            sorted.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
            break;
        case 'title':
            sorted.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
            break;
        case 'amount':
            sorted.sort((a, b) => a.used_mass - b.used_mass);
            break;
        default:
            break;
    }
    renderConsumptions(sorted);
    filterHistory();
}

// ============================
// ДОБАВЛЕНИЕ РАСХОДА
// ============================

async function loadFilamentsForSelect() {
    const token = localStorage.getItem('token');
    if (!token) return;
    try {
        const response = await fetch(`${API_URL}/materials/`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            }
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || data.error || 'Ошибка загрузки');
        const select = document.getElementById('consumptionMaterialSelect');
        select.innerHTML = '<option value="">Выберите катушку</option>';
        (data.data || []).forEach(f => {
            const option = document.createElement('option');
            option.value = f.id;
            option.textContent = `${f.name} (${f.color || 'без цвета'}) — ${f.current_mass || 0}g / ${f.initial_mass}g`;
            select.appendChild(option);
        });
    } catch (error) {
        console.error('Ошибка загрузки катушек:', error);
    }
}

function openAddConsumption() {
    document.getElementById('addConsumptionModal').style.display = 'flex';
    document.getElementById('consumptionTitle').value = '';
    document.getElementById('consumptionMass').value = '10';
    loadFilamentsForSelect();
}

function closeAddConsumption() {
    document.getElementById('addConsumptionModal').style.display = 'none';
}

document.getElementById('addConsumptionModal').addEventListener('click', function(e) {
    if (e.target === this) closeAddConsumption();
});

async function createConsumption() {
    const materialId = document.getElementById('consumptionMaterialSelect').value;
    const title = document.getElementById('consumptionTitle').value.trim();
    const usedMass = parseFloat(document.getElementById('consumptionMass').value);
    
    if (!materialId) { alert('Выберите катушку'); return; }
    if (!title) { alert('Введите название действия'); return; }
    if (!usedMass || usedMass <= 0) { alert('Введите корректную массу'); return; }
    
    const token = localStorage.getItem('token');
    if (!token) { alert('Вы не авторизованы'); return; }
    
    try {
        const response = await fetch(`${API_URL}/consumptions/create`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
                material_id: parseInt(materialId),
                title: title,
                used_mass: usedMass
            })
        });
        
        const data = await response.json();
        console.log('Ответ сервера (расход):', data);
        
        if (!response.ok) {
            throw new Error(data.message || data.error || 'Ошибка создания расхода');
        }
        
        alert('Расход успешно добавлен!');
        closeAddConsumption();
        await loadAllConsumptions();
    } catch (error) {
        alert('Ошибка: ' + error.message);
    }
}

// ============================
// НАСТРОЙКИ
// ============================

function openSettings() {
    document.getElementById('settingsModal').style.display = 'flex';
}

function closeSettings() {
    document.getElementById('settingsModal').style.display = 'none';
}

document.getElementById('settingsModal').addEventListener('click', function(e) {
    if (e.target === this) closeSettings();
});

function saveSettings() {
    const theme = document.getElementById('darkTheme').checked;
    const units = document.getElementById('unitsSelect').value;
    const notifications = document.getElementById('notifications').checked;
    console.log('Сохранено:', { theme, units, notifications });
    alert('Настройки сохранены!');
    closeSettings();
}

// ============================
// ИНИЦИАЛИЗАЦИЯ
// ============================

window.onload = async function() {
    await checkAuth();
    await loadAllConsumptions();
};
</script>

<div class="app">
    <div class="top-section">
        <div class="header">
            <h1 class="logo">Использование</h1>
            <div id="authContainer"></div>
        </div>
        <div class="search-section">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Поиск..." oninput="filterHistory()" />
            </div>
            <button class="filter-button" onclick="toggleSort()" title="Сортировка">
                <i class="fa-solid fa-arrow-up-wide-short"></i>
            </button>
        </div>
    </div>

    <main class="content">
        <div class="history-list" id="historyList"></div>
    </main>

    <button class="fab-button" onclick="openAddConsumption()">
        <i class="fa-solid fa-plus"></i>
    </button>

    <footer class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-database"></i>
            <span>Катушки</span>
        </a>
        <a href="usage.html" class="nav-item active">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Использование</span>
        </a>
        <a href="stats.html" class="nav-item">
            <i class="fa-solid fa-chart-column"></i>
            <span>Статистика</span>
        </a>
        <button class="nav-item" onclick="openSettings()">
            <i class="fa-solid fa-gear"></i>
            <span>Настройки</span>
        </button>
    </footer>
</div>

<!-- МОДАЛКА НАСТРОЕК -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal">
        <div class="modal-header">
            <h2>Настройки</h2>
            <button class="modal-close" onclick="closeSettings()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="setting-item">
                <label>Темная тема</label>
                <input type="checkbox" id="darkTheme" checked>
            </div>
            <div class="setting-item">
                <label>Единицы измерения</label>
                <select id="unitsSelect">
                    <option value="grams">Граммы</option>
                    <option value="kg">Килограммы</option>
                </select>
            </div>
            <div class="setting-item">
                <label>Уведомления</label>
                <input type="checkbox" id="notifications" checked>
            </div>
            <button class="save-button" onclick="saveSettings()">Сохранить</button>
        </div>
    </div>
</div>

<!-- МОДАЛКА ДОБАВЛЕНИЯ РАСХОДА -->
<div class="modal-overlay" id="addConsumptionModal">
    <div class="modal modal-wide">
        <div class="modal-header">
            <h2>Добавить расход</h2>
            <button class="modal-close" onclick="closeAddConsumption()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="consumptionMaterialSelect">Катушка</label>
                <select id="consumptionMaterialSelect">
                    <option value="">Загрузка...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="consumptionTitle">Название действия</label>
                <input type="text" id="consumptionTitle" placeholder="Печать детали" />
            </div>
            <div class="form-group">
                <label for="consumptionMass">Использовано (граммы)</label>
                <input type="number" id="consumptionMass" placeholder="50" value="10" />
            </div>
            <button class="auth-button" onclick="createConsumption()">
                <i class="fa-solid fa-floppy-disk"></i> Сохранить расход
            </button>
        </div>
    </div>
</div>
</body>
</html>
