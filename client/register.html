<!DOCTYPE html> 
<html lang="ru"> 
<head>
<meta charset="UTF-8">
    <title>Регистрация - FilamentAccounting</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>FilamentAccounting</h1>
                <p>Создайте аккаунт</p>
            </div>
            
            <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="username">
                        <i class="fa-solid fa-user"></i>
                        Логин
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        placeholder="Введите логин" 
                        required
                        minlength="3"
                    />
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fa-solid fa-lock"></i>
                        Пароль
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Введите пароль (мин. 4 символа)" 
                            required
                            minlength="4"
                        />
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fa-solid fa-eye" id="passwordIcon"></i>
                        </button>
                    </div>
                </div>
                
                <div id="errorMessage" class="error-message" style="display:none;"></div>
                
                <button type="submit" class="auth-button" id="registerButton">
                    <i class="fa-solid fa-user-plus"></i>
                    Зарегистрироваться
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
            </div>
        </div>
    </div>
    
    <script src="js/register.js"></script>
</body>
</html>
