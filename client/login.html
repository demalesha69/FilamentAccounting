<!DOCTYPE html> 
<html lang="ru"> 
<head>
    <meta charset="UTF-8">
    <title>Вход - FilamentAccounting</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>FilamentAccounting</h1>
                <p>Войдите в аккаунт</p>
            </div>
            
            <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginUsername">
                        <i class="fa-solid fa-user"></i>
                        Логин
                    </label>
                    <input 
                        type="text" 
                        id="loginUsername" 
                        placeholder="Введите логин" 
                        required
                    />
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">
                        <i class="fa-solid fa-lock"></i>
                        Пароль
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="loginPassword" 
                            placeholder="Введите пароль" 
                            required
                        />
                        <button type="button" class="toggle-password" onclick="toggleLoginPassword()">
                            <i class="fa-solid fa-eye" id="loginPasswordIcon"></i>
                        </button>
                    </div>
                </div>
                
                <div id="errorMessage" class="error-message" style="display:none;"></div>
                
                <button type="submit" class="auth-button" id="loginButton">
                    <i class="fa-solid fa-sign-in-alt"></i>
                    Войти
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
            </div>
        </div>
    </div>
    
    <script src="js/login.js"></script>
</body>
</html>
