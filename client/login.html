<!DOCTYPE html> 
<html lang="ru"> 
<head>
    <title>Вход - FilamentAccounting</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>FilamentAccounting</h1>
                <p>Войдите в аккаунт</p>
            </div>
            
            <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginUsername">
                        <i class="fa-solid fa-user"></i>
                        Логин
                    </label>
                    <input 
                        type="text" 
                        id="loginUsername" 
                        placeholder="Введите логин" 
                        required
                    />
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">
                        <i class="fa-solid fa-lock"></i>
                        Пароль
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="loginPassword" 
                            placeholder="Введите пароль" 
                            required
                        />
                        <button type="button" class="toggle-password" onclick="toggleLoginPassword()">
                            <i class="fa-solid fa-eye" id="loginPasswordIcon"></i>
                        </button>
                    </div>
                </div>
                
                <div id="errorMessage" class="error-message" style="display:none;"></div>
                
                <button type="submit" class="auth-button" id="loginButton">
                    <i class="fa-solid fa-sign-in-alt"></i>
                    Войти
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
            </div>
        </div>
    </div>
    
    <script>
        // ============================
        // НАСТРОЙКИ
        // ============================
        
        const API_URL = 'http://186.246.28.163:8000/'; // URL твоего сервера
        
        // ============================
        // ПОКАЗ/СКРЫТИЕ ПАРОЛЯ
        // ============================
        
        function toggleLoginPassword() {
            const password = document.getElementById('loginPassword');
            const icon = document.getElementById('loginPasswordIcon');
            
            if (password.type === 'password') {
                password.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                password.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }
        
        // ============================
        // ВХОД
        // ============================
        
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('errorMessage');
            const button = document.getElementById('loginButton');
            
            // Скрываем старую ошибку
            errorDiv.style.display = 'none';
            
            // Валидация
            if (!username || !password) {
                showError('Заполните все поля');
                return;
            }
            
            // Блокируем кнопку
            button.disabled = true;
            button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Загрузка...';
            
            try {
                // Отправка запроса на сервер
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                // Проверка ответа
                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка входа');
                }
                
                // Успешный вход
                if (data.token) {
                    // Сохраняем JWT токен
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    alert('Вход выполнен успешно!');
                    window.location.href = 'index.html';
                } else {
                    throw new Error('Токен не получен');
                }
                
            } catch (error) {
                showError(error.message);
            } finally {
                // Разблокируем кнопку
                button.disabled = false;
                button.innerHTML = '<i class="fa-solid fa-sign-in-alt"></i> Войти';
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
