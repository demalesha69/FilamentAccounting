<!DOCTYPE html> 
<html lang="ru"> 
<head>
<meta charset="UTF-8">
    <title>FilamentAccounting</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

<div class="app">
    <div class="top-section">
        <div class="header">
            <h1 class="logo">Катушки</h1>
            <div id="authContainer"></div>
        </div>
        <div class="search-section">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Поиск филамента..." oninput="searchFilaments()" />
            </div>
            <button class="filter-button" onclick="openFilter()">
                <i class="fa-solid fa-sliders"></i>
            </button>
        </div>
    </div>

    <main class="content">
        <section class="filament-grid" id="filamentGrid"></section>
    </main>

    <button class="fab-button" onclick="openAddFilament()">
        <i class="fa-solid fa-plus"></i>
    </button>

    <footer class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <i class="fa-solid fa-database"></i>
            <span>Катушки</span>
        </a>
        <a href="usage.html" class="nav-item">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Использование</span>
        </a>
        <a href="stats.html" class="nav-item">
            <i class="fa-solid fa-chart-column"></i>
            <span>Статистика</span>
        </a>
        <button class="nav-item" onclick="openSettings()">
            <i class="fa-solid fa-gear"></i>
            <span>Настройки</span>
        </button>
    </footer>
</div>

<!-- МОДАЛКА НАСТРОЕК -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal">
        <div class="modal-header">
            <h2>Настройки</h2>
            <button class="modal-close" onclick="closeSettings()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="setting-item">
                <label>Темная тема</label>
                <input type="checkbox" id="darkTheme" checked>
            </div>
            <div class="setting-item">
                <label>Единицы измерения</label>
                <select id="unitsSelect">
                    <option value="grams">Граммы</option>
                    <option value="kg">Килограммы</option>
                </select>
            </div>
            <div class="setting-item">
                <label>Уведомления</label>
                <input type="checkbox" id="notifications" checked>
            </div>
            <button class="save-button" onclick="saveSettings()">Сохранить</button>
        </div>
    </div>
</div>

<!-- МОДАЛКА ДОБАВЛЕНИЯ КАТУШКИ -->
<div class="modal-overlay" id="addFilamentModal">
    <div class="modal modal-wide">
        <div class="modal-header">
            <h2>Добавить катушку</h2>
            <button class="modal-close" onclick="closeAddFilament()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('manual')" id="tabManual">
                    <i class="fa-solid fa-pen"></i> Вручную
                </button>
                <button class="tab" onclick="switchTab('qr')" id="tabQR">
                    <i class="fa-solid fa-qrcode"></i> QR-код
                </button>
            </div>
            
            <div class="tab-content active" id="tabManualContent">
                <div class="form-group">
                    <label for="filamentName">Название</label>
                    <input type="text" id="filamentName" placeholder="PLA" />
                </div>
                <div class="form-group">
                    <label for="filamentType">Тип материала</label>
                    <input type="text" id="filamentType" placeholder="PLA, PETG, ABS" />
                </div>
                <div class="form-group">
                    <label for="filamentColor">Цвет</label>
                    <div class="color-select">
                        <input type="text" id="filamentColor" placeholder="Green" />
                        <div class="color-picker">
                            <button class="color-option green" onclick="setColor('green')"></button>
                            <button class="color-option yellow" onclick="setColor('yellow')"></button>
                            <button class="color-option red" onclick="setColor('red')"></button>
                            <button class="color-option blue" onclick="setColor('blue')"></button>
                            <button class="color-option orange" onclick="setColor('orange')"></button>
                            <button class="color-option purple" onclick="setColor('purple')"></button>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="filamentWeight">Вес (граммы)</label>
                    <input type="number" id="filamentWeight" placeholder="1000" value="1000" />
                </div>
                <button class="auth-button" onclick="addFilamentManual()">
                    <i class="fa-solid fa-plus"></i> Добавить катушку
                </button>
            </div>
            
            <div class="tab-content" id="tabQRContent">
                <div class="form-group">
                    <label for="qrCodeInput">Введите QR-код</label>
                    <input type="text" id="qrCodeInput" placeholder='{"name":"PLA","material_type":"PLA","color":"Green","initial_mass":1000}' />
                </div>
                <button class="auth-button" onclick="addFilamentByQR()">
                    <i class="fa-solid fa-qrcode"></i> Добавить по QR
                </button>
                <div style="text-align:center; color:#9ca3af; font-size:13px; margin-top:12px;">
                    <i class="fa-solid fa-info-circle"></i>
                    Формат: {"name":"PLA","material_type":"PLA","color":"Green","initial_mass":1000}
                </div>
            </div>
        </div>
    </div>
</div>

<!-- МОДАЛКА ДЕТАЛЕЙ КАТУШКИ -->
<div class="modal-overlay" id="detailModal">
    <div class="modal modal-wide">
        <div class="modal-header">
            <h2 id="detailTitle">Детали катушки</h2>
            <button class="modal-close" onclick="closeDetailModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body" id="detailBody"></div>
    </div>
</div>

<!-- МОДАЛКА СОРТИРОВКИ -->
<div class="modal-overlay" id="filterModal">
    <div class="modal modal-small">
        <div class="modal-header">
            <h2>Сортировка и фильтры</h2>
            <button class="modal-close" onclick="closeFilter()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="filter-section">
                <label class="filter-label">Сортировка</label>
                <button class="filter-option active" onclick="sortFilaments('default')" id="filterDefault">
                    <i class="fa-solid fa-list"></i> <span>По умолчанию</span>
                </button>
                <button class="filter-option" onclick="sortFilaments('name')" id="filterName">
                    <i class="fa-solid fa-font"></i> <span>По названию (А-Я)</span>
                </button>
                <button class="filter-option" onclick="sortFilaments('nameDesc')" id="filterNameDesc">
                    <i class="fa-solid fa-font"></i> <span>По названию (Я-А)</span>
                </button>
                <button class="filter-option" onclick="sortFilaments('progress')" id="filterProgress">
                    <i class="fa-solid fa-circle"></i> <span>По остатку (возрастание)</span>
                </button>
                <button class="filter-option" onclick="sortFilaments('progressDesc')" id="filterProgressDesc">
                    <i class="fa-solid fa-circle"></i> <span>По остатку (убывание)</span>
                </button>
                <button class="filter-option" onclick="sortFilaments('color')" id="filterColor">
                    <i class="fa-solid fa-palette"></i> <span>По цвету</span>
                </button>
            </div>
            <div class="filter-divider"></div>
            <div class="filter-section">
                <label class="filter-label">Фильтр по типу</label>
                <button class="filter-option active" onclick="filterByType('all')" id="filterTypeAll">
                    <i class="fa-solid fa-layer-group"></i> <span>Все типы</span>
                </button>
                <button class="filter-option" onclick="filterByType('pla')" id="filterTypePLA">
                    <i class="fa-solid fa-cube"></i> <span>PLA</span>
                </button>
                <button class="filter-option" onclick="filterByType('petg')" id="filterTypePETG">
                    <i class="fa-solid fa-cube"></i> <span>PETG</span>
                </button>
                <button class="filter-option" onclick="filterByType('abs')" id="filterTypeABS">
                    <i class="fa-solid fa-cube"></i> <span>ABS</span>
                </button>
                <button class="filter-option" onclick="filterByType('tpu')" id="filterTypeTPU">
                    <i class="fa-solid fa-cube"></i> <span>TPU</span>
                </button>
                <button class="filter-option" onclick="filterByType('other')" id="filterTypeOther">
                    <i class="fa-solid fa-cube"></i> <span>Другое</span>
                </button>
            </div>
            <button class="filter-reset" onclick="resetFilters()">
                <i class="fa-solid fa-rotate-left"></i> Сбросить фильтры
            </button>
        </div>
    </div>
</div>

<script>
const API_URL = 'http://186.246.28.163:8000';
let allFilaments = [];
let currentSort = 'default';
let currentFilterType = 'all';
let currentFilamentId = null;

// ============================
// АВТОРИЗАЦИЯ
// ============================

async function checkAuth() {
    const token = localStorage.getItem('token');
    if (!token) {
        updateAuthUI(false);
        return false;
    }
    updateAuthUI(true);
    showUsername();
    return true;
}

function updateAuthUI(isLoggedIn) {
    const container = document.getElementById('authContainer');
    if (!container) return;
    if (isLoggedIn) {
        container.innerHTML = `
            <span style="color:#9ca3af; font-size:14px;" id="usernameDisplay"></span>
            <button class="icon-button" onclick="logout()" title="Выйти">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        `;
    } else {
        container.innerHTML = `
            <a href="login.html" class="icon-button" title="Войти">
                <i class="fa-solid fa-right-to-bracket"></i>
            </a>
        `;
    }
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'login.html';
}

function showUsername() {
    try {
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const display = document.getElementById('usernameDisplay');
        if (display) display.textContent = user.username || 'Пользователь';
    } catch (e) {}
}

// ============================
// НАСТРОЙКИ
// ============================

function openSettings() {
    document.getElementById('settingsModal').style.display = 'flex';
}

function closeSettings() {
    document.getElementById('settingsModal').style.display = 'none';
}

document.getElementById('settingsModal').addEventListener('click', function(e) {
    if (e.target === this) closeSettings();
});

function saveSettings() {
    const theme = document.getElementById('darkTheme').checked;
    const units = document.getElementById('unitsSelect').value;
    const notifications = document.getElementById('notifications').checked;
    console.log('Сохранено:', { theme, units, notifications });
    alert('Настройки сохранены!');
    closeSettings();
}

// ============================
// СОРТИРОВКА И ФИЛЬТРАЦИЯ
// ============================

function closeFilter() {
    document.getElementById('filterModal').style.display = 'none';
}

function openFilter() {
    document.getElementById('filterModal').style.display = 'flex';
}

document.getElementById('filterModal').addEventListener('click', function(e) {
    if (e.target === this) closeFilter();
});

function sortFilaments(type) {
    currentSort = type;
    document.querySelectorAll('.filter-option').forEach(btn => btn.classList.remove('active'));
    const activeBtn = { 'default': 'filterDefault', 'name': 'filterName', 'nameDesc': 'filterNameDesc', 'progress': 'filterProgress', 'progressDesc': 'filterProgressDesc', 'color': 'filterColor' }[type];
    if (activeBtn) document.getElementById(activeBtn).classList.add('active');
    applyFiltersAndSort();
    closeFilter();
}

function filterByType(type) {
    currentFilterType = type;
    document.querySelectorAll('.filter-option').forEach(btn => btn.classList.remove('active'));
    const activeBtn = { 'all': 'filterTypeAll', 'pla': 'filterTypePLA', 'petg': 'filterTypePETG', 'abs': 'filterTypeABS', 'tpu': 'filterTypeTPU', 'other': 'filterTypeOther' }[type];
    if (activeBtn) document.getElementById(activeBtn).classList.add('active');
    applyFiltersAndSort();
    closeFilter();
}

function searchFilaments() {
    applyFiltersAndSort();
}

function applyFiltersAndSort() {
    const searchQuery = document.getElementById('searchInput')?.value.toLowerCase().trim() || '';
    let filtered = [...allFilaments];
    if (searchQuery) {
        filtered = filtered.filter(f => 
            (f.name || '').toLowerCase().includes(searchQuery) ||
            (f.color || '').toLowerCase().includes(searchQuery) ||
            (f.type || '').toLowerCase().includes(searchQuery)
        );
    }
    if (currentFilterType !== 'all') {
        filtered = filtered.filter(f => {
            const type = (f.type || '').toLowerCase();
            if (currentFilterType === 'other') return !['pla', 'petg', 'abs', 'tpu'].includes(type);
            return type === currentFilterType;
        });
    }
    filtered.sort((a, b) => {
        switch(currentSort) {
            case 'name': return (a.name || '').localeCompare(b.name || '');
            case 'nameDesc': return (b.name || '').localeCompare(a.name || '');
            case 'progress': return ((a.current_mass || 0) / (a.initial_mass || 1)) - ((b.current_mass || 0) / (b.initial_mass || 1));
            case 'progressDesc': return ((b.current_mass || 0) / (b.initial_mass || 1)) - ((a.current_mass || 0) / (a.initial_mass || 1));
            case 'color': return (a.color || '').localeCompare(b.color || '');
            default: return (a.id || 0) - (b.id || 0);
        }
    });
    renderFilaments(filtered);
}

function resetFilters() {
    currentFilterType = 'all';
    currentSort = 'default';
    document.getElementById('searchInput').value = '';
    document.querySelectorAll('.filter-option').forEach(btn => btn.classList.remove('active'));
    document.getElementById('filterDefault').classList.add('active');
    document.getElementById('filterTypeAll').classList.add('active');
    applyFiltersAndSort();
    closeFilter();
}

// ============================
// ЗАГРУЗКА КАТУШЕК
// ============================

async function loadFilaments() {
    const token = localStorage.getItem('token');
    if (!token) return;
    try {
        const response = await fetch(`${API_URL}/materials/`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            }
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || data.error || 'Ошибка загрузки');
        allFilaments = data.data || [];
        applyFiltersAndSort();
    } catch (error) {
        console.error('Ошибка загрузки катушек:', error);
    }
}

// ============================
// ОТРИСОВКА КАТУШЕК
// ============================

function renderFilaments(filaments) {
    const grid = document.getElementById('filamentGrid');
    if (!grid) return;
    if (!filaments || filaments.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#9ca3af;">
            <i class="fa-solid fa-box-open" style="font-size:48px;margin-bottom:12px;display:block;"></i>
            <p>Нет катушек. Добавьте первую!</p>
        </div>`;
        return;
    }
    grid.innerHTML = filaments.map(f => {
        const colorMap = { 'green': '#56d364', 'yellow': '#f5c542', 'red': '#ff5f5f', 'blue': '#58a6ff', 'orange': '#ff8c00', 'purple': '#a855f7', 'black': '#222222', 'white': '#ffffff' };
        const colorHex = colorMap[(f.color || '').toLowerCase()] || '#8b5cf6';
        const progress = Math.round(((f.current_mass || 0) / (f.initial_mass || 1)) * 100);
        return `<article class="filament-card" onclick="openDetailModal(${f.id})" style="cursor:pointer;">
            <div class="card-top">
                <div class="progress-ring" style="--progress:${progress};--ring-color:${colorHex};">
                    <span>${progress}%</span>
                </div>
                <div class="filament-info">
                    <h2>${f.name || 'Без названия'}</h2>
                    <p class="filament-color" style="color:${colorHex};">${f.color || ''} ${f.type ? '• ' + f.type : ''}</p>
                </div>
            </div>
            <div class="weight-info" style="color:${colorHex};">
                <div class="weight-dot"></div>
                <span>${f.current_mass || 0}g / ${f.initial_mass || 0}g</span>
            </div>
        </article>`;
    }).join('');
}

// ============================
// ДЕТАЛЬНАЯ МОДАЛКА
// ============================

function openDetailModal(id) {
    currentFilamentId = id;
    const filament = allFilaments.find(f => f.id === id);
    if (!filament) { alert('Катушка не найдена'); return; }
    
    const modal = document.getElementById('detailModal');
    const body = document.getElementById('detailBody');
    
    const colorMap = { 'green': '#56d364', 'yellow': '#f5c542', 'red': '#ff5f5f', 'blue': '#58a6ff', 'orange': '#ff8c00', 'purple': '#a855f7', 'black': '#222222', 'white': '#ffffff' };
    const colorHex = colorMap[(filament.color || '').toLowerCase()] || '#8b5cf6';
    const progress = Math.round(((filament.current_mass || 0) / (filament.initial_mass || 1)) * 100);
    const used = (filament.initial_mass || 0) - (filament.current_mass || 0);
    
    const qrData = JSON.stringify({ id: filament.id, name: filament.name, type: filament.type, color: filament.color, initial_mass: filament.initial_mass, current_mass: filament.current_mass });
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrData)}`;
    
    loadConsumptionHistory(id).then(historyHtml => {
        body.innerHTML = `
            <div style="display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start;">
                <div style="flex:1; min-width:200px;">
                    <div style="display:flex; align-items:center; gap:16px; margin-bottom:16px;">
                        <div class="progress-ring" style="--size:80px; width:80px; height:80px; min-width:80px; --progress:${progress}; --ring-color:${colorHex};">
                            <span style="font-size:16px;">${progress}%</span>
                        </div>
                        <div>
                            <h2 style="color:#ffffff; font-size:22px; margin-bottom:4px;">${filament.name}</h2>
                            <p style="color:${colorHex}; font-size:16px; font-weight:600;">${filament.color || 'Без цвета'} ${filament.type ? '• ' + filament.type : ''}</p>
                        </div>
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;">
                        <div style="background:#232734; border-radius:10px; padding:12px; text-align:center;">
                            <div style="font-size:12px; color:#9ca3af;">Начальный вес</div>
                            <div style="font-size:20px; font-weight:700; color:#ffffff;">${filament.initial_mass}g</div>
                        </div>
                        <div style="background:#232734; border-radius:10px; padding:12px; text-align:center;">
                            <div style="font-size:12px; color:#9ca3af;">Текущий вес</div>
                            <div style="font-size:20px; font-weight:700; color:#ffffff;">${filament.current_mass || 0}g</div>
                        </div>
                        <div style="background:#232734; border-radius:10px; padding:12px; text-align:center;">
                            <div style="font-size:12px; color:#9ca3af;">Использовано</div>
                            <div style="font-size:20px; font-weight:700; color:#ff5f5f;">${used}g</div>
                        </div>
                        <div style="background:#232734; border-radius:10px; padding:12px; text-align:center;">
                            <div style="font-size:12px; color:#9ca3af;">ID</div>
                            <div style="font-size:16px; font-weight:700; color:#ffffff;">#${filament.id}</div>
                        </div>
                    </div>
                </div>
                <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:160px; background:#232734; border-radius:16px; padding:16px;">
                    <div style="position:relative; display:inline-block;">
                        <img id="qrCodeImage" src="${qrUrl}" alt="QR-код" style="width:140px; height:140px; border-radius:8px; background:white; padding:8px;" />
                        <button onclick="downloadQRCode()" title="Скачать QR-код" style="position:absolute; bottom:4px; right:4px; width:32px; height:32px; border:none; border-radius:50%; background:#8b5cf6; color:white; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; box-shadow:0 2px 8px rgba(0,0,0,0.3);">
                            <i class="fa-solid fa-download"></i>
                        </button>
                    </div>
                    <div style="font-size:11px; color:#9ca3af; margin-top:8px; text-align:center; word-break:break-all; max-width:140px;">ID: #${filament.id}</div>
                    <button onclick="deleteFilament(${filament.id})" style="margin-top:12px; background:#ff5f5f; color:white; border:none; border-radius:12px; width:100%; padding:10px; font-size:14px; font-weight:600; cursor:pointer;">
                        <i class="fa-solid fa-trash"></i> Удалить
                    </button>
                </div>
            </div>
            <div style="margin-top:16px; background:#232734; border-radius:10px; padding:12px;">
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
                    <i class="fa-solid fa-clock-rotate-left" style="color:#9ca3af; font-size:14px;"></i>
                    <span style="font-size:13px; font-weight:600; color:#9ca3af;">ИСТОРИЯ РАСХОДА</span>
                </div>
                ${historyHtml}
            </div>
        `;
        modal.style.display = 'flex';
    });
}

function closeDetailModal() {
    document.getElementById('detailModal').style.display = 'none';
    currentFilamentId = null;
}

document.getElementById('detailModal').addEventListener('click', function(e) {
    if (e.target === this) closeDetailModal();
});

// ============================
// ИСТОРИЯ РАСХОДА (API /consumptions/{material_id})
// ============================

async function loadConsumptionHistory(materialId) {
    const token = localStorage.getItem('token');
    if (!token) return `<div style="text-align:center;padding:8px 0;color:#9ca3af;font-size:13px;">Авторизуйтесь для просмотра истории</div>`;
    
    try {
        const response = await fetch(`${API_URL}/consumptions/${materialId}`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            }
        });
        
        if (response.status === 404) {
            return `<div style="text-align:center;padding:8px 0;color:#9ca3af;font-size:13px;">
                <i class="fa-solid fa-inbox" style="display:block;font-size:18px;margin-bottom:4px;opacity:0.5;"></i>
                Пока что расходов по этой катушке не было
            </div>`;
        }
        
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || data.error || 'Ошибка загрузки истории');
        
        const history = data.data || [];
        if (history.length === 0) {
            return `<div style="text-align:center;padding:8px 0;color:#9ca3af;font-size:13px;">
                <i class="fa-solid fa-inbox" style="display:block;font-size:18px;margin-bottom:4px;opacity:0.5;"></i>
                Пока что расходов по этой катушке не было
            </div>`;
        }
        
        return `<div style="display:flex;flex-direction:column;gap:6px;max-height:150px;overflow-y:auto;padding-right:4px;">
            ${history.map(item => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#1a1d26;border-radius:8px;border-left:3px solid #ff5f5f;">
                    <div style="display:flex;align-items:center;gap:12px;flex:1;">
                        <span style="color:#ffffff;font-size:13px;font-weight:500;">${item.title || 'Без названия'}</span>
                        <span style="color:#9ca3af;font-size:11px;">
                            <i class="fa-regular fa-calendar"></i> ${item.timestamp ? new Date(item.timestamp).toLocaleString('ru-RU') : ''}
                        </span>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span style="font-size:13px;color:#9ca3af;">Остаток: ${item.remain_mass}g</span>
                        <span style="font-size:15px;font-weight:700;color:#ff5f5f;white-space:nowrap;">-${item.used_mass}g</span>
                    </div>
                </div>
            `).join('')}
        </div>`;
    } catch (error) {
        console.error('Ошибка загрузки истории:', error);
        return `<div style="text-align:center;padding:8px 0;color:#ff5f5f;font-size:13px;">Ошибка загрузки истории</div>`;
    }
}

// ============================
// СКАЧИВАНИЕ QR-КОДА
// ============================

function downloadQRCode() {
    const img = document.getElementById('qrCodeImage');
    if (!img) { alert('QR-код не найден'); return; }
    const link = document.createElement('a');
    link.download = `qr-code-${currentFilamentId || 'filament'}.png`;
    link.href = img.src;
    link.target = '_blank';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

// ============================
// УДАЛЕНИЕ КАТУШКИ
// ============================

async function deleteFilament(id) {
    if (!confirm('Вы уверены, что хотите удалить эту катушку?')) return;
    const token = localStorage.getItem('token');
    if (!token) { alert('Вы не авторизованы'); return; }
    try {
        const response = await fetch(`${API_URL}/materials/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || data.error || 'Ошибка удаления');
        alert('Катушка успешно удалена!');
        closeDetailModal();
        loadFilaments();
    } catch (error) {
        alert('Ошибка: ' + error.message);
    }
}

// ============================
// ДОБАВЛЕНИЕ КАТУШКИ
// ============================

function openAddFilament() {
    document.getElementById('addFilamentModal').style.display = 'flex';
    document.getElementById('filamentName').value = '';
    document.getElementById('filamentType').value = '';
    document.getElementById('filamentColor').value = '';
    document.getElementById('filamentWeight').value = '1000';
    document.getElementById('qrCodeInput').value = '';
}

function closeAddFilament() {
    document.getElementById('addFilamentModal').style.display = 'none';
}

document.getElementById('addFilamentModal').addEventListener('click', function(e) {
    if (e.target === this) closeAddFilament();
});

function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    if (tab === 'manual') {
        document.getElementById('tabManual').classList.add('active');
        document.getElementById('tabManualContent').classList.add('active');
    } else {
        document.getElementById('tabQR').classList.add('active');
        document.getElementById('tabQRContent').classList.add('active');
    }
}

function setColor(color) {
    const map = { 'green': 'Green', 'yellow': 'Yellow', 'red': 'Red', 'blue': 'Blue', 'orange': 'Orange', 'purple': 'Purple' };
    document.getElementById('filamentColor').value = map[color] || color;
}

async function addFilamentManual() {
    const name = document.getElementById('filamentName').value.trim();
    const type = document.getElementById('filamentType').value.trim();
    const color = document.getElementById('filamentColor').value.trim();
    const weight = parseFloat(document.getElementById('filamentWeight').value);
    if (!name) { alert('Введите название катушки'); return; }
    if (!type) { alert('Введите тип материала'); return; }
    if (!color) { alert('Введите цвет катушки'); return; }
    if (!weight || weight < 1) { alert('Введите корректный вес'); return; }
    const token = localStorage.getItem('token');
    if (!token) { alert('Вы не авторизованы'); return; }
    try {
        const response = await fetch(`${API_URL}/materials/create`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ name, material_type: type, color, initial_mass: weight })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || data.error || 'Ошибка добавления');
        alert('Катушка успешно добавлена!');
        closeAddFilament();
        loadFilaments();
    } catch (error) {
        alert('Ошибка: ' + error.message);
    }
}

async function addFilamentByQR() {
    const qrData = document.getElementById('qrCodeInput').value.trim();
    if (!qrData) { alert('Введите данные из QR-кода'); return; }
    const token = localStorage.getItem('token');
    if (!token) { alert('Вы не авторизованы'); return; }
    try {
        let data;
        try { data = JSON.parse(qrData); } catch(e) {
            const parts = qrData.split('|');
            data = { name: parts[0] || 'Unknown', material_type: parts[1] || parts[0] || 'Unknown', color: parts[2] || 'White', initial_mass: parseFloat(parts[3]) || 1000 };
        }
        const response = await fetch(`${API_URL}/materials/create`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(data)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || result.error || 'Ошибка добавления');
        alert('Катушка успешно добавлена по QR-коду!');
        closeAddFilament();
        loadFilaments();
    } catch (error) {
        alert('Ошибка: ' + error.message);
    }
}

// ============================
// ИНИЦИАЛИЗАЦИЯ
// ============================

window.onload = async function() {
    await checkAuth();
    await loadFilaments();
};
</script>
