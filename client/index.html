<!DOCTYPE html> 
<html lang="ru"> 
<head>
<meta charset="UTF-8">
    <title>FilamentAccounting</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <!-- Библиотека для сканирования QR-кодов -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div id="notification" class="notification" style="display:none;">
    <div class="notification-content">
        <i class="fa-solid fa-check-circle" id="notificationIcon"></i>
        <span id="notificationMessage">Успешно!</span>
    </div>
</div>

<div class="app">
    <div class="top-section">
        <div class="header">
            <h1 class="logo">Катушки</h1>
            <div id="authContainer"></div>
        </div>
        <div class="search-section">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Поиск филамента..." oninput="searchFilaments()" />
            </div>
            <button class="filter-button" onclick="openFilter()">
                <i class="fa-solid fa-sliders"></i>
            </button>
        </div>
    </div>

    <main class="content">
        <section class="filament-grid" id="filamentGrid"></section>
    </main>

    <!-- Две кнопки: QR-сканер и добавление -->
    <div class="fab-group">
        <button class="fab-button fab-scan" onclick="openQRScanner()" title="Сканировать QR-код">
            <i class="fa-solid fa-qrcode"></i>
        </button>
        <button class="fab-button" onclick="openAddFilament()" title="Добавить катушку">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <footer class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <i class="fa-solid fa-database"></i>
            <span>Катушки</span>
        </a>
        <a href="usage.html" class="nav-item">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Использование</span>
        </a>
        <a href="stats.html" class="nav-item">
            <i class="fa-solid fa-chart-column"></i>
            <span>Статистика</span>
        </a>
    </footer>
</div>

<!-- Модальное окно для QR-сканера -->
<div class="modal-overlay" id="qrScannerModal">
    <div class="modal modal-wide">
        <div class="modal-header">
            <h2>Сканировать QR-код</h2>
            <button class="modal-close" onclick="closeQRScanner()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <div style="display:flex; flex-direction:column; gap:12px;">
                <!-- Выбор способа сканирования -->
                <div style="display:flex; gap:10px;">
                    <button class="auth-button" id="scanCameraBtn" onclick="switchScanMethod('camera')" style="flex:1; background:#3b82f6;">
                        <i class="fa-solid fa-camera"></i> Камера
                    </button>
                    <button class="auth-button" id="scanFileBtn" onclick="switchScanMethod('file')" style="flex:1; background:#8b5cf6;">
                        <i class="fa-solid fa-image"></i> Файл
                    </button>
                </div>
                
                <!-- Область для камеры -->
                <div id="qrCameraArea">
                    <div id="qr-reader" style="width:100%; min-height:250px;"></div>
                    <div id="qr-reader-results" style="margin-top:12px; text-align:center; color:#9ca3af; font-size:14px; min-height:40px;">
                        Наведите камеру на QR-код или загрузите изображение
                    </div>
                    <button class="auth-button" id="qrScannerToggleBtn" onclick="toggleQRScanner()" style="width:100%;">
                        <i class="fa-solid fa-play"></i> Запустить камеру
                    </button>
                </div>
                
                <!-- Область для загрузки файла -->
                <div id="qrFileArea" style="display:none; flex-direction:column; gap:12px;">
                    <div style="border:2px dashed rgba(255,255,255,0.1); border-radius:16px; padding:30px; text-align:center; background:#1a1d26; cursor:pointer;" 
                         onclick="document.getElementById('qrFileInput').click()">
                        <i class="fa-solid fa-cloud-arrow-up" style="font-size:48px; color:#6b7280; display:block; margin-bottom:12px;"></i>
                        <p style="color:#9ca3af; font-size:14px;">Нажмите или перетащите изображение</p>
                        <p style="color:#6b7280; font-size:12px; margin-top:4px;">Поддерживаются: PNG, JPG, WebP</p>
                    </div>
                    <input type="file" id="qrFileInput" accept="image/*" style="display:none;" onchange="scanQRFromFile(event)" />
                    <div id="qrFileResult" style="text-align:center; color:#9ca3af; font-size:14px; min-height:30px;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно добавления катушки -->
<div class="modal-overlay" id="addFilamentModal">
    <div class="modal modal-wide">
        <div class="modal-header">
            <h2>Добавить катушку</h2>
            <button class="modal-close" onclick="closeAddFilament()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="filamentName">Название</label>
                <input type="text" id="filamentName" placeholder="PLA Черный" />
            </div>
            <div class="form-group">
                <label for="filamentType">Тип материала</label>
                <select id="filamentType" onchange="updateAdvancedDefaults()">
                    <option value="">Выберите тип</option>
                    <option value="PLA">PLA</option>
                    <option value="PETG">PETG</option>
                    <option value="ABS">ABS</option>
                    <option value="HIPS">HIPS</option>
                    <option value="SBS">SBS</option>
                    <option value="TPU">TPU</option>
                    <option value="NYLON">NYLON</option>
                    <option value="ASA">ASA</option>
                    <option value="PP">PP</option>
                    <option value="PC">PC</option>
                    <option value="POM">POM</option>
                    <option value="PMMA">PMMA</option>
                    <option value="PEEK">PEEK</option>
                    <option value="Ceramo">Ceramo</option>
                    <option value="PVA">PVA</option>
                    <option value="WAX">WAX</option>
                    <option value="Clearing">Clearing</option>
                </select>
            </div>
            <div class="form-group">
                <label for="filamentColor">Цвет</label>
                <div class="color-select">
                    <input type="text" id="filamentColor" placeholder="Black" />
                    <div class="color-picker expanded">
                        <button class="color-option black" onclick="setColor('black')" title="Черный"></button>
                        <button class="color-option white" onclick="setColor('white')" title="Белый"></button>
                        <button class="color-option gray" onclick="setColor('gray')" title="Серый"></button>
                        <button class="color-option silver" onclick="setColor('silver')" title="Серебристый"></button>
                        <button class="color-option red" onclick="setColor('red')" title="Красный"></button>
                        <button class="color-option crimson" onclick="setColor('crimson')" title="Малиновый"></button>
                        <button class="color-option pink" onclick="setColor('pink')" title="Розовый"></button>
                        <button class="color-option orange" onclick="setColor('orange')" title="Оранжевый"></button>
                        <button class="color-option gold" onclick="setColor('gold')" title="Золотой"></button>
                        <button class="color-option yellow" onclick="setColor('yellow')" title="Желтый"></button>
                        <button class="color-option lime" onclick="setColor('lime')" title="Лайм"></button>
                        <button class="color-option green" onclick="setColor('green')" title="Зеленый"></button>
                        <button class="color-option teal" onclick="setColor('teal')" title="Бирюзовый"></button>
                        <button class="color-option cyan" onclick="setColor('cyan')" title="Циан"></button>
                        <button class="color-option blue" onclick="setColor('blue')" title="Синий"></button>
                        <button class="color-option navy" onclick="setColor('navy')" title="Темно-синий"></button>
                        <button class="color-option purple" onclick="setColor('purple')" title="Фиолетовый"></button>
                        <button class="color-option violet" onclick="setColor('violet')" title="Лиловый"></button>
                        <button class="color-option magenta" onclick="setColor('magenta')" title="Пурпурный"></button>
                        <button class="color-option brown" onclick="setColor('brown')" title="Коричневый"></button>
                        <button class="color-option beige" onclick="setColor('beige')" title="Бежевый"></button>
                        <button class="color-option transparent" onclick="setColor('transparent')" title="Прозрачный"></button>
                        <button class="color-option glow" onclick="setColor('glow')" title="Светящийся"></button>
                        <button class="color-option multicolor" onclick="setColor('multicolor')" title="Мультицвет"></button>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="filamentWeight">Вес (граммы)</label>
                <input type="number" id="filamentWeight" placeholder="1000" value="1000" min="1" max="1000000" step="1" maxlength="8" oninput="if(this.value.length > 8) this.value = this.value.slice(0,8); checkFilamentFields()" />
                <small style="color:#9ca3af; font-size:12px; margin-top:4px;">Максимальный вес: 1 тонна (1 000 000 г)</small>
            </div>
            
            <!-- Расширенные настройки -->
            <div style="margin-top:4px;">
                <button class="auth-button" onclick="toggleAdvancedSettings()" type="button" style="background:#232734; color:#9ca3af; font-size:14px; padding:10px; margin-top:0;">
                    <i class="fa-solid fa-gear" id="advancedIcon"></i> Расширенные настройки
                </button>
                <div id="advancedSettings" style="display:none; margin-top:12px; padding:12px; background:#232734; border-radius:12px;">
                    <div class="form-group">
                        <label for="filamentDensity">Плотность (г/см³)</label>
                        <input type="number" id="filamentDensity" placeholder="1.24" step="0.01" min="0.1" max="10" value="1.24" />
                    </div>
                    <div class="form-group">
                        <label for="filamentDiameter">Диаметр (мм)</label>
                        <input type="number" id="filamentDiameter" placeholder="1.75" step="0.01" min="0.5" max="5" value="1.75" />
                    </div>
                </div>
            </div>
            
            <button class="auth-button" id="addFilamentBtn" onclick="addFilamentManual()" disabled>
                <i class="fa-solid fa-plus"></i> Добавить катушку
            </button>
        </div>
    </div>
</div>

<!-- Модальное окно деталей катушки -->
<div class="modal-overlay" id="detailModal">
    <div class="modal modal-wide">
        <div class="modal-header">
            <h2 id="detailTitle">Детали катушки</h2>
            <button class="modal-close" onclick="closeDetailModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body" id="detailBody"></div>
    </div>
</div>

<!-- Модальное окно фильтров -->
<div class="modal-overlay" id="filterModal">
    <div class="modal modal-small">
        <div class="modal-header">
            <h2>Сортировка и фильтры</h2>
            <button class="modal-close" onclick="closeFilter()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="filter-section">
                <label class="filter-label">Сортировка</label>
                <button class="filter-option active" onclick="sortFilaments('default')" id="filterDefault">
                    <i class="fa-solid fa-list"></i> <span>По умолчанию</span>
                </button>
                <button class="filter-option" onclick="sortFilaments('name')" id="filterName">
                    <i class="fa-solid fa-font"></i> <span>По названию (А-Я)</span>
                </button>
                <button class="filter-option" onclick="sortFilaments('nameDesc')" id="filterNameDesc">
                    <i class="fa-solid fa-font"></i> <span>По названию (Я-А)</span>
                </button>
                <button class="filter-option" onclick="sortFilaments('progress')" id="filterProgress">
                    <i class="fa-solid fa-circle"></i> <span>По остатку (возрастание)</span>
                </button>
                <button class="filter-option" onclick="sortFilaments('progressDesc')" id="filterProgressDesc">
                    <i class="fa-solid fa-circle"></i> <span>По остатку (убывание)</span>
                </button>
                <button class="filter-option" onclick="sortFilaments('color')" id="filterColor">
                    <i class="fa-solid fa-palette"></i> <span>По цвету</span>
                </button>
            </div>
            <div class="filter-divider"></div>
            <div class="filter-section">
                <label class="filter-label">Фильтр по типу</label>
                <button class="filter-option active" onclick="filterByType('all')" id="filterTypeAll">
                    <i class="fa-solid fa-layer-group"></i> <span>Все типы</span>
                </button>
                <button class="filter-option" onclick="filterByType('pla')" id="filterTypePLA">
                    <i class="fa-solid fa-cube"></i> <span>PLA</span>
                </button>
                <button class="filter-option" onclick="filterByType('petg')" id="filterTypePETG">
                    <i class="fa-solid fa-cube"></i> <span>PETG</span>
                </button>
                <button class="filter-option" onclick="filterByType('abs')" id="filterTypeABS">
                    <i class="fa-solid fa-cube"></i> <span>ABS</span>
                </button>
                <button class="filter-option" onclick="filterByType('hips')" id="filterTypeHIPS">
                    <i class="fa-solid fa-cube"></i> <span>HIPS</span>
                </button>
                <button class="filter-option" onclick="filterByType('sbs')" id="filterTypeSBS">
                    <i class="fa-solid fa-cube"></i> <span>SBS</span>
                </button>
                <button class="filter-option" onclick="filterByType('tpu')" id="filterTypeTPU">
                    <i class="fa-solid fa-cube"></i> <span>TPU</span>
                </button>
                <button class="filter-option" onclick="filterByType('nylon')" id="filterTypeNYLON">
                    <i class="fa-solid fa-cube"></i> <span>NYLON</span>
                </button>
                <button class="filter-option" onclick="filterByType('asa')" id="filterTypeASA">
                    <i class="fa-solid fa-cube"></i> <span>ASA</span>
                </button>
                <button class="filter-option" onclick="filterByType('pp')" id="filterTypePP">
                    <i class="fa-solid fa-cube"></i> <span>PP</span>
                </button>
                <button class="filter-option" onclick="filterByType('pc')" id="filterTypePC">
                    <i class="fa-solid fa-cube"></i> <span>PC</span>
                </button>
                <button class="filter-option" onclick="filterByType('pom')" id="filterTypePOM">
                    <i class="fa-solid fa-cube"></i> <span>POM</span>
                </button>
                <button class="filter-option" onclick="filterByType('pmma')" id="filterTypePMMA">
                    <i class="fa-solid fa-cube"></i> <span>PMMA</span>
                </button>
                <button class="filter-option" onclick="filterByType('peek')" id="filterTypePEEK">
                    <i class="fa-solid fa-cube"></i> <span>PEEK</span>
                </button>
                <button class="filter-option" onclick="filterByType('ceramo')" id="filterTypeCeramo">
                    <i class="fa-solid fa-cube"></i> <span>Ceramo</span>
                </button>
                <button class="filter-option" onclick="filterByType('pva')" id="filterTypePVA">
                    <i class="fa-solid fa-cube"></i> <span>PVA</span>
                </button>
                <button class="filter-option" onclick="filterByType('wax')" id="filterTypeWAX">
                    <i class="fa-solid fa-cube"></i> <span>WAX</span>
                </button>
                <button class="filter-option" onclick="filterByType('clearing')" id="filterTypeClearing">
                    <i class="fa-solid fa-cube"></i> <span>Clearing</span>
                </button>
                <button class="filter-option" onclick="filterByType('other')" id="filterTypeOther">
                    <i class="fa-solid fa-cube"></i> <span>Другое</span>
                </button>
            </div>
            <button class="filter-reset" onclick="resetFilters()">
                <i class="fa-solid fa-rotate-left"></i> Сбросить фильтры
            </button>
        </div>
    </div>
</div>

<script src="js/index.js"></script>
</body>
</html>
