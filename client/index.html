<!DOCTYPE html> 
<html lang="ru"> 
<head>
<meta charset="UTF-8">
    <title>FilamentAccounting</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>

<div id="notification" class="notification" style="display:none;">
    <div class="notification-content">
        <i class="fa-solid fa-check-circle" id="notificationIcon"></i>
        <span id="notificationMessage">Успешно!</span>
    </div>
</div>

<div class="app">
    <div class="top-section">
        <div class="header">
            <h1 class="logo">Катушки</h1>
            <div id="authContainer"></div>
        </div>
        <div class="search-section">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Поиск филамента..." oninput="searchFilaments()" />
            </div>
            <button class="filter-button" onclick="openFilter()">
                <i class="fa-solid fa-sliders"></i>
            </button>
        </div>
    </div>

    <main class="content">
        <section class="filament-grid" id="filamentGrid"></section>
    </main>

    <button class="fab-button" onclick="openAddFilament()">
        <i class="fa-solid fa-plus"></i>
    </button>

    <footer class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <i class="fa-solid fa-database"></i>
            <span>Катушки</span>
        </a>
        <a href="usage.html" class="nav-item">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Использование</span>
        </a>
        <a href="stats.html" class="nav-item">
            <i class="fa-solid fa-chart-column"></i>
            <span>Статистика</span>
        </a>
        <button class="nav-item" onclick="openSettings()">
            <i class="fa-solid fa-gear"></i>
            <span>Настройки</span>
        </button>
    </footer>
</div>

<div class="modal-overlay" id="settingsModal">
    <div class="modal">
        <div class="modal-header">
            <h2>Настройки</h2>
            <button class="modal-close" onclick="closeSettings()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="setting-item">
                <label>Темная тема</label>
                <input type="checkbox" id="darkTheme" checked>
            </div>
            <div class="setting-item">
                <label>Уведомления</label>
                <input type="checkbox" id="notifications" checked>
            </div>
            <button class="save-button" onclick="saveSettings()">Сохранить</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="addFilamentModal">
    <div class="modal modal-wide">
        <div class="modal-header">
            <h2>Добавить катушку</h2>
            <button class="modal-close" onclick="closeAddFilament()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="filamentName">Название</label>
                <input type="text" id="filamentName" placeholder="PLA Черный" />
            </div>
            <div class="form-group">
                <label for="filamentType">Тип материала</label>
                <input type="text" id="filamentType" placeholder="PLA, PETG, ABS" />
            </div>
            <div class="form-group">
                <label for="filamentColor">Цвет</label>
                <div class="color-select">
                    <input type="text" id="filamentColor" placeholder="Black" />
                    <div class="color-picker">
                        <button class="color-option green" onclick="setColor('green')"></button>
                        <button class="color-option yellow" onclick="setColor('yellow')"></button>
                        <button class="color-option red" onclick="setColor('red')"></button>
                        <button class="color-option blue" onclick="setColor('blue')"></button>
                        <button class="color-option orange" onclick="setColor('orange')"></button>
                        <button class="color-option purple" onclick="setColor('purple')"></button>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="filamentWeight">Вес (граммы)</label>
                <input type="number" id="filamentWeight" placeholder="1000" value="1000" />
            </div>
            <button class="auth-button" id="addFilamentBtn" onclick="addFilamentManual()" disabled>
                <i class="fa-solid fa-plus"></i> Добавить катушку
            </button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="detailModal">
    <div class="modal modal-wide">
        <div class="modal-header">
            <h2 id="detailTitle">Детали катушки</h2>
            <button class="modal-close" onclick="closeDetailModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body" id="detailBody"></div>
    </div>
</div>

<div class="modal-overlay" id="filterModal">
    <div class="modal modal-small">
        <div class="modal-header">
            <h2>Сортировка и фильтры</h2>
            <button class="modal-close" onclick="closeFilter()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="filter-section">
                <label class="filter-label">Сортировка</label>
                <button class="filter-option active" onclick="sortFilaments('default')" id="filterDefault">
                    <i class="fa-solid fa-list"></i> <span>По умолчанию</span>
                </button>
                <button class="filter-option" onclick="sortFilaments('name')" id="filterName">
                    <i class="fa-solid fa-font"></i> <span>По названию (А-Я)</span>
                </button>
                <button class="filter-option" onclick="sortFilaments('nameDesc')" id="filterNameDesc">
                    <i class="fa-solid fa-font"></i> <span>По названию (Я-А)</span>
                </button>
                <button class="filter-option" onclick="sortFilaments('progress')" id="filterProgress">
                    <i class="fa-solid fa-circle"></i> <span>По остатку (возрастание)</span>
                </button>
                <button class="filter-option" onclick="sortFilaments('progressDesc')" id="filterProgressDesc">
                    <i class="fa-solid fa-circle"></i> <span>По остатку (убывание)</span>
                </button>
                <button class="filter-option" onclick="sortFilaments('color')" id="filterColor">
                    <i class="fa-solid fa-palette"></i> <span>По цвету</span>
                </button>
            </div>
            <div class="filter-divider"></div>
            <div class="filter-section">
                <label class="filter-label">Фильтр по типу</label>
                <button class="filter-option active" onclick="filterByType('all')" id="filterTypeAll">
                    <i class="fa-solid fa-layer-group"></i> <span>Все типы</span>
                </button>
                <button class="filter-option" onclick="filterByType('pla')" id="filterTypePLA">
                    <i class="fa-solid fa-cube"></i> <span>PLA</span>
                </button>
                <button class="filter-option" onclick="filterByType('petg')" id="filterTypePETG">
                    <i class="fa-solid fa-cube"></i> <span>PETG</span>
                </button>
                <button class="filter-option" onclick="filterByType('abs')" id="filterTypeABS">
                    <i class="fa-solid fa-cube"></i> <span>ABS</span>
                </button>
                <button class="filter-option" onclick="filterByType('tpu')" id="filterTypeTPU">
                    <i class="fa-solid fa-cube"></i> <span>TPU</span>
                </button>
                <button class="filter-option" onclick="filterByType('other')" id="filterTypeOther">
                    <i class="fa-solid fa-cube"></i> <span>Другое</span>
                </button>
            </div>
            <button class="filter-reset" onclick="resetFilters()">
                <i class="fa-solid fa-rotate-left"></i> Сбросить фильтры
            </button>
        </div>
    </div>
</div>

<script src="js/index.js"></script>
</body>
</html>
